# Деплой на GitHub Pages (Settings → Pages → Source: GitHub Actions).
#
# Репозиторий: https://github.com/Adegeminas/Arlight-test
# Сайт после деплоя: https://adegeminas.github.io/Arlight-test/
#
# VITE_BASE_PATH берётся из имени репозитория (= /Arlight-test/).
# Исключение: репозиторий USERNAME.github.io — задайте VITE_BASE_PATH: '/'

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Имя репозитория → путь на Pages; для USERNAME.github.io замените на '/'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
