# Репозиторий: https://github.com/Adegeminas/Arlight-test
# Сайт: https://adegeminas.github.io/Arlight-test/
#
# ВАЖНО: Settings → Pages → Build and deployment → Source: GitHub Actions.
# НЕ используйте "Deploy from a branch" с папкой / (корень репо): тогда отдаётся
# исходный index.html + src/main.js → в консоли "Failed to resolve module specifier vue".
# Нужен артефакт сборки (папка dist после npm run build).
# В vite.config.js base по умолчанию './' — иначе при ошибочном '/' бандл запрашивает /assets/…
# с корня домена → 404 HTML → MIME type text/html для module script.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
